# A broker for the aggregation queues, kept in its own file.
#
#   docker compose -p aggregation-kafka -f deploy/docker-compose.kafka.yml up -d
#   then AGGREGATION_LAYER_KAFKA_ENABLED=true in deploy/.env and recreate the service.
#
# Joins the stack network as "agg-kafka", so the aggregation layer uses
# AGGREGATION_LAYER_KAFKA_BOOTSTRAP_SERVERS=agg-kafka:9094. Host clients use
# localhost:9092 (do not run it together with the old consent-kafka, same port).
#
# KRaft mode - no ZooKeeper. One broker, which is also the controller, so
# replication factor 1 is the only value that can work here.
services:
  kafka:
    # The Apache project's own image, not bitnami/kafka: Bitnami withdrew its
    # versioned tags from Docker Hub, so `bitnami/kafka:3.7` now fails to
    # resolve. Note the env vars are KAFKA_* here, not Bitnami's KAFKA_CFG_*.
    image: apache/kafka:3.9.0
    networks: [openg2p]
    container_name: agg-kafka
    ports:
      # The aggregator runs on the host, so it connects on localhost:9092.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9094,CONTROLLER://:9093,EXTERNAL://:9092"
      # Two advertised listeners because there are two kinds of client: other
      # containers reach the broker as "kafka", the host-run aggregator reaches
      # it as "localhost". Advertise only one and whichever client is not it
      # connects, gets told to go somewhere it cannot reach, and hangs.
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://agg-kafka:9094,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # A single broker has nobody to rebalance with; the 3s default just adds
      # 3s to every consumer's first poll.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # The service creates its own four topics at startup (kafka_topic_init),
      # mirroring the Audit Manager's topicInit job. Leave this off so a typo in
      # a topic name fails loudly instead of silently producing to a new one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # No volume on purpose: this broker is a dev queue, not a store of record.
    # The service recreates its four topics on startup, so a wiped broker costs
    # nothing but the messages that were in flight — and those are recoverable
    # from the aggregation_requests rows with `run-local.sh --reap`.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Optional. Lets you watch the four topics fill and drain during a demo,
  # which is the quickest way to show that the portal answered before the
  # registries were touched.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks: [openg2p]
    container_name: agg-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aggregation-layer
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: agg-kafka:9094
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

networks:
  openg2p:
    external: true
    name: ${OPENG2P_NETWORK:-openg2p-developer_default}
