# Dev: New Dev (13.201.58.55), namespace commons, release commons-services. The settings of
# commons-services-aggregation-api, copied from the running Deployment on 13 Nov 2026. Jenkins lints and
# renders the chart with them; in oan-helm the same settings are the `aggregation-api:` block of
# charts/openg2p-commons-services/values.yaml (there the catalog is the existing ConfigMap
# aggregation-api-catalog, and hosts use {{ .Values.global.baseDomain }}). Image tags (tag@digest) come
# from the packaged values.yaml.
#   helm template commons-services oan-aggregation-api-<version>.tgz -n commons -f values-dev.yaml

virtualService:
  enabled: true
  host: aggregation.development.oanstaging.com
  gateway: istio-system/development

# Created in commons outside any chart (same Secrets the commons-services Deployment uses).
signing:
  existingSecret: aggregation-api-signing-rsa-20261023
  kid: agg-2026-01
runtimeSecret: aggregation-api-runtime

env:
  AGGREGATION_LAYER_CM_BASE_URL: http://commons-services-cm-partner-api.commons.svc.cluster.local
  AGGREGATION_LAYER_CM_DATA_CONTROLLER: aggregation_layer
  AGGREGATION_LAYER_AUTH_ENABLED: "true"
  AGGREGATION_LAYER_AUTH_ISSUER: https://keycloak.development.oanstaging.com/realms/staff
  AGGREGATION_LAYER_AUTH_JWKS_URL: http://commons-keycloak.commons.svc.cluster.local/realms/staff/protocol/openid-connect/certs
  AGGREGATION_LAYER_PARTNER_AUTH_ISSUER: https://keycloak.development.oanstaging.com/realms/partner
  AGGREGATION_LAYER_PARTNER_AUTH_JWKS_URL: http://commons-keycloak.commons.svc.cluster.local/realms/partner/protocol/openid-connect/certs
  AGGREGATION_LAYER_PARTNER_AUTH_PARTNER_CLAIM: partner_id
  AGGREGATION_LAYER_STAFF_SEARCH_ROLES: '["AGGREGATION_STAFF_VIEWER"]'
  AGGREGATION_LAYER_STAFF_API_TOKEN_URL: https://keycloak.development.oanstaging.com/realms/staff/protocol/openid-connect/token
  AGGREGATION_LAYER_STAFF_API_CLIENT_ID: aggregation-layer-staff

# Registry catalog (was ConfigMap aggregation-api-catalog). Format: deploy/registries.yaml.
catalog:
  existingConfigMap: ''
  registries:
    FARMER_REGISTRY:
      name: Farmer Registry
      partner_api:
        base_url: https://partner-farmer.development.oanstaging.com
        receiver_id: farmer-registry
      staff_api:
        base_url: http://farmer-registry-staff-portal-api.farmer.svc.cluster.local
        registers:
        - Farmer
      binding:
        audience: agg-layer-farmer
        controller_id: farmer-registry
        allowed_purposes:
        - loan_origination
        - subsidy_verification
      search:
        reg_type: Farmer
        reg_record_type: spdci-extensions-dci:FarmerRecord
        id_type: UIN
        match:
          path: farmer_personal_details.member_identifier[]
          strip_prefixes:
          - FAN-
      registers:
        FARMER:
          name: Farmer
          functional_record_id: farmer_personal_details.member_identifier[].identifier_value
          last_approved_at: farmer_personal_details.last_updated
      scopes:
        farmer_personal_details:
          register: FARMER
          fields:
          - member_identifier[].identifier_value
          - demographic_info.name.given_name
          - demographic_info.name.second_name
          - demographic_info.name.surname
          - demographic_info.phone_number
          - demographic_info.email
          - place.name
          - place.geo.@type
          - place.geo.latitude
          - place.geo.longitude
          - demographic_info.sex
          - demographic_info.birth_date
          - marital_status
          - education_level
          - registration_date
        family_details:
          table: HOUSEHOLD
          name: Household
          parent: FARMER
          internal_record_id: group_identifier[].identifier_value
          fields:
          - '*'
        farm_details:
          table: FARM
          name: Farm
          parent: FARMER
          fields:
          - '*'
    LIVESTOCK_REGISTRY:
      name: Livestock Registry
      partner_api:
        base_url: https://partner-livestock.development.oanstaging.com
        receiver_id: livestock-registry
      staff_api:
        base_url: http://livestock-registry-staff-portal-api.livestock.svc.cluster.local
        registers:
        - Farmer
        - Livestock
      binding:
        audience: agg-layer-livestock
        controller_id: livestock-registry
        allowed_purposes:
        - loan_origination
        - subsidy_verification
      search:
        reg_type: Livestock
        reg_record_type: spdci-extensions-dci:LivestockRecord
        id_type: UIN
        match:
          path: livestock_details.farmer_info.member_identifier[]
          strip_prefixes:
          - FAN-
      registers:
        LIVESTOCK:
          name: Livestock holding
          functional_record_id: livestock_details.record_identifier[].identifier_value
          record_status: livestock_details.status
      scopes:
        livestock_details:
          register: LIVESTOCK
          fields:
          - record_identifier[].identifier_value
          - oan_id
          - status
          - total_animals
          - registration_date
          - farmer_info.demographic_info.name.given_name
          - farmer_info.demographic_info.name.surname
          - farmer_info.phone_number
          - place
        animal_details:
          table: ANIMAL
          name: Animal
          parent: LIVESTOCK
          fields:
          - '*'
        health_event_details:
          table: HEALTH_EVENT
          name: Health event
          parent: LIVESTOCK
          fields:
          - '*'
        vaccination_details:
          table: VACCINATION
          name: Vaccination
          parent: LIVESTOCK
          fields:
          - '*'
        vital_event_details:
          table: VITAL_EVENT
          name: Vital event
          parent: LIVESTOCK
          fields:
          - '*'
        breeding_details:
          table: BREEDING
          name: Breeding
          parent: LIVESTOCK
          fields:
          - '*'
    CROPSOWN_REGISTRY:
      name: Crop Sown Registry
      partner_api:
        base_url: https://partner-crop.development.oanstaging.com
        receiver_id: cropsown-registry
      staff_api:
        base_url: http://cropsown-registry-staff-portal-api.crop.svc.cluster.local
        registers:
        - CropSown
      binding:
        audience: agg-layer-cropsown
        controller_id: cropsown-registry
        allowed_purposes:
        - loan_origination
        - subsidy_verification
      search:
        reg_type: CropSown
        reg_record_type: spdci-extensions-dci:CropSownRecord
        id_type: UIN
        match:
          path: crop_sown_details.farmer_info.member_identifier[]
          strip_prefixes:
          - FAN-
      registers:
        CROP_SOWN:
          name: Crop sown
          functional_record_id: crop_sown_details.record_identifier[].identifier_value
      scopes:
        crop_sown_details:
          register: CROP_SOWN
          fields:
          - '*'
        farm_details:
          table: FARM
          name: Farm
          parent: CROP_SOWN
          fields:
          - '*'
        crop_production_details:
          table: CROP_PRODUCTION
          name: Crop production
          parent: CROP_SOWN
          fields:
          - '*'
        infestation_details:
          table: INFESTATION
          name: Infestation
          parent: CROP_SOWN
          fields:
          - '*'
        cluster_details:
          table: CLUSTER
          name: Cluster
          parent: CROP_SOWN
          fields:
          - '*'
