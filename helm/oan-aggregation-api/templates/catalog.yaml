{{- if .Values.catalog.registries }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oan-aggregation-api.catalogConfigMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oan-aggregation-api.labels" . | nindent 4 }}
data:
  registries.yaml: |
    version: 1
    registries:
      {{- toYaml .Values.catalog.registries | nindent 6 }}
{{- end }}
