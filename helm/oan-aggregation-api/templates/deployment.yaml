apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oan-aggregation-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oan-aggregation-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "oan-aggregation-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oan-aggregation-api.selectorLabels" . | nindent 8 }}
      {{- if .Values.catalog.registries }}
      annotations:
        # The service reads the catalog only at start: a catalog change rolls the pods.
        checksum/catalog: {{ include (print $.Template.BasePath "/catalog.yaml") . | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: aggregation-api
          image: {{ include "oan-aggregation-api.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: AGGREGATION_LAYER_REGISTRY_CATALOG_PATH
              value: /app/config/registries.yaml
            - name: AGGREGATION_LAYER_SIGNING_P12_PATH
              value: /app/keys/{{ .Values.signing.p12Key }}
            - name: AGGREGATION_LAYER_SIGNING_P12_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "signing.existingSecret is required" .Values.signing.existingSecret }}
                  key: {{ .Values.signing.passwordKey }}
            - name: AGGREGATION_LAYER_SIGNING_KID
              value: {{ required "signing.kid is required" .Values.signing.kid | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ tpl ($value | toString) $ | quote }}
            {{- end }}
          {{- with .Values.runtimeSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
          volumeMounts:
            - name: signing
              mountPath: /app/keys
              readOnly: true
            - name: catalog
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: signing
          secret:
            secretName: {{ .Values.signing.existingSecret }}
            items:
              - key: {{ .Values.signing.p12Key }}
                path: {{ .Values.signing.p12Key }}
        - name: catalog
          configMap:
            name: {{ include "oan-aggregation-api.catalogConfigMap" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
