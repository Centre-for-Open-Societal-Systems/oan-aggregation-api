[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-aggregation-layer"
authors = [
  { name = "OpenG2P", email = "info@openg2p.org" },
]
description = "OpenG2P Aggregation Layer — one consent-gated Beneficiary-360 call across several registries, answered as a DCI on-search (sync, or async on a callback). No database."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "openg2p-fastapi-common >=1.1.4",
  # No database here, but the framework imports sqlalchemy.ext.asyncio; 2.1
  # stopped installing greenlet, and an unpinned build starts and then every
  # worker dies (seen on the CM image).
  "sqlalchemy[asyncio] >=2.0,<2.1",
  "cryptography >=42.0.0",
  "pyjwt >=2.8.0",
  "httpx",
  # The registry catalog (registry_catalog.py).
  "pyyaml >=6.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://openg2p.org"
Repository = "https://github.com/Centre-for-Open-Societal-Systems/oan-aggregation-api"

[tool.hatch.version]
path = "src/openg2p_aggregation_layer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openg2p_aggregation_layer"]
